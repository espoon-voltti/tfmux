# tfmux configuration — copy to ~/.config/tfmux/config.toml
# (or $XDG_CONFIG_HOME/tfmux/config.toml)

# Directories scanned for git repos containing Terraform root modules.
roots = ["~/work/iac"]

# Max concurrent terraform subprocesses. Plans of different workspaces of the
# SAME module are always serialized regardless of this setting.
parallelism = 4

# Terraform binary. tfenv shims work (commands run in the module directory,
# so per-directory .terraform-version files resolve). Set "tofu" for OpenTofu.
terraform_bin = "terraform"

# Saved plan files older than this are deleted (they contain secrets).
plan_ttl = "24h"

# Max concurrent `terraform init` calls, across all modules. 0 (default)
# auto-detects: capped to 1 when a Terraform/OpenTofu plugin cache
# (plugin_cache_dir / TF_PLUGIN_CACHE_DIR) is configured — concurrent inits
# against a shared cache can corrupt it — unlimited otherwise. Set explicitly
# to override detection.
#init_parallelism = 0

# `tfmux mcp`: the MCP server for an agent running elsewhere (e.g. inside a
# sandbox without credentials). tools = "read-only" exposes inspection plus
# plan/output/workspace enumeration; "all" adds apply, init -upgrade and
# discard. The HTTP endpoint needs a bearer token (see `tfmux mcp
# --print-config`) and should stay on loopback.
#[mcp]
#listen = "127.0.0.1:7411"
#tools = "read-only"

# Per-repo overrides, keyed by repo path.
#[repos."~/work/iac/legacy-repo"]
#terraform_bin = "terraform-0.13"
